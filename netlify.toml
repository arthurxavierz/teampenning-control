# Publicação do Achilles Team Penning no Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O app é uma SPA com React Router. Sem esta regra, abrir uma rota direto
# (por exemplo /admin ou /eventos/8-etapa-ctm-hsf) ou dar F5 devolveria 404.
# Toda rota cai no index.html e o roteador resolve no navegador.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
